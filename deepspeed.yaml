# DeepSpeed ZeRO-2 for the unified HotPotQA runs (LoRA r=1: no optimizer
# offload needed — the 7B base stays frozen, so states are tiny).
# gradient_accumulation_steps here is the source of truth at runtime; rl_runner.py
# aligns the training config to it (4 GPUs x 8 batch x 64 = 2048-completion pool).
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  gradient_accumulation_steps: 64
  gradient_clipping: 1.0
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero_stage: 2
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
